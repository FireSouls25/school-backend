# Despliegue backend: solo corre en tags api-v* cuyo commit YA pasó CI.
# No repite tests: la puerta `gate` exige el run verde de `ci` para el
# mismo SHA. Construye la imagen ARM64, la sube a ECR y la instancia la
# trae y reinicia por SSM (el schema migra solo al arrancar).
name: deploy

on:
  push:
    tags: ["api-v*"]

permissions:
  contents: read
  actions: read
  id-token: write

env:
  AWS_REGION: us-east-1
  ECR_REPO: 931858724425.dkr.ecr.us-east-1.amazonaws.com/grado-api
  INSTANCE_ID: i-046603393f4c2d16e

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA="${{ github.sha }}"
          CONC=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=$SHA&per_page=1" --jq '.workflow_runs[0].conclusion // "missing"')
          echo "CI conclusion for $SHA: $CONC"
          if [ "$CONC" != "success" ]; then
            echo "El tag debe apuntar a un commit con CI verde en main."
            exit 1
          fi

  image:
    needs: [gate]
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "tag=${GITHUB_REF_NAME#api-}" >> "$GITHUB_OUTPUT"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::931858724425:role/grado-gh-deploy
          role-skip-session-tagging: true
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          build-args: VERSION=${{ steps.meta.outputs.tag }}
          tags: ${{ env.ECR_REPO }}:${{ steps.meta.outputs.tag }},${{ env.ECR_REPO }}:prod

  rollout:
    needs: [gate, image]
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::931858724425:role/grado-gh-deploy
          aws-region: ${{ env.AWS_REGION }}
      - run: |
          IMG="${{ env.ECR_REPO }}:${{ needs.image.outputs.tag }}"
          TAG="${{ needs.image.outputs.tag }}"
          CMD_ID=$(aws ssm send-command \
            --instance-ids "${{ env.INSTANCE_ID }}" \
            --document-name AWS-RunShellScript \
            --timeout-seconds 600 \
            --parameters "{\"commands\":[\"set -e\",\"aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ env.ECR_REPO }}\",\"docker pull $IMG\",\"docker tag $IMG grado-api:prod\",\"sed -i '/^APP_VERSION=/d' /etc/grado.env && echo APP_VERSION=$TAG >> /etc/grado.env\",\"systemctl restart grado-api\",\"sleep 12\",\"curl -s http://127.0.0.1:8080/healthz\"]}" \
            --query Command.CommandId --output text)
          echo "command=$CMD_ID"
          for i in $(seq 1 20); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "${{ env.INSTANCE_ID }}" --query Status --output text)
            echo "status=$STATUS"
            [ "$STATUS" != "InProgress" ] && break
            sleep 15
          done
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "${{ env.INSTANCE_ID }}" --query StandardOutputContent --output text
          [ "$STATUS" = "Success" ] || exit 1
      - run: curl -s -m 30 https://api.fractalschool.app/healthz
