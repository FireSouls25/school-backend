# Local stack: Postgres plus the API. For development and demos the API
# comes up with demo data (SEED_DEMO below), so a fresh clone is testable
# in one command. For production, copy .env.example to .env, set
# APP_ENV=production and a real BOOTSTRAP_ADMIN_PASSWORD, and use your
# own managed database.

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-grade}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-grade}
      POSTGRES_DB: ${POSTGRES_DB:-gradedb}
    ports:
      # 5433 avoids clashing with a system Postgres on 5432.
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-grade} -d ${POSTGRES_DB:-gradedb}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      PORT: "8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-grade}:${POSTGRES_PASSWORD:-grade}@db:5432/${POSTGRES_DB:-gradedb}?sslmode=disable
      # Empty means same-origin only. Needed for the SPA dev server.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:1420,http://127.0.0.1:1420}
      # Dev only: seeds a demo school on boot. Forced off in production.
      SEED_DEMO: ${SEED_DEMO:-true}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@observador.edu.co}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-admin123*}
    ports:
      - "${API_PORT:-8080}:8080"

volumes:
  pgdata: